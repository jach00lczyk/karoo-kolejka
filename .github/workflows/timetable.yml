name: Rozkład (codziennie)

on:
  schedule:
    - cron: "30 1 * * *" # ≈ 02:30–03:30 w Warszawie
  workflow_dispatch:
    inputs:
      force:
        description: "Buduj nawet bez zmian w źródłach"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["pipeline/**", ".github/workflows/timetable.yml"]

permissions:
  contents: write

# Wspólna grupa z android.yml: oba workflowy force-pushują gh-pages.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Testy
        working-directory: pipeline
        run: |
          pip install -r requirements.txt
          pytest -q

      - name: Poprzednia publikacja
        run: |
          mkdir -p dist
          if git fetch --depth=1 origin gh-pages; then
            git show FETCH_HEAD:manifest.json > prev-manifest.json || rm -f prev-manifest.json
            # app-manifest.json (aktualizacja APK, SPEC 4.3) zarządza android.yml — przenosimy go bez zmian.
            git show FETCH_HEAD:app-manifest.json > dist/app-manifest.json || rm -f dist/app-manifest.json
          fi

      - name: Budowa rozkładu
        id: build
        run: |
          args="--out dist --cache cache"
          [ -f prev-manifest.json ] && args="$args --previous-manifest prev-manifest.json"
          # Push na main (zmiana pipeline'u) zawsze przebudowuje dane.
          if [ "${{ inputs.force }}" = "true" ] || [ "${{ github.event_name }}" = "push" ]; then args="$args --force"; fi
          mkdir -p cache
          python pipeline/build_timetable.py $args

      - name: Publikacja na gh-pages
        if: steps.build.outputs.publish == 'true' && github.ref == 'refs/heads/main'
        working-directory: dist
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Rozkład $(jq -r .version manifest.json)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
